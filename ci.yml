# =============================================================================
# CI Pipeline — Build, Test, Push
# Owner: Chaithanya (CI/CD Lead)
#
# Triggers:
#   - Push to main or develop
#   - Pull requests to main
#
# Flow:
#   1. Checkout code
#   2. Run Python tests
#   3. Build Docker image
#   4. Push to AWS ECR (or DockerHub fallback)
# =============================================================================

name: CI — Build & Push

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel redundant runs when new commits push on same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ── Change these to match your setup ──────────────────────────
  AWS_REGION:       us-east-1
  ECR_REPOSITORY:   bi-platform          # Your ECR repo name
  IMAGE_NAME:       bi-platform          # Used as DockerHub fallback name

jobs:
  # ── Job 1: Test ───────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip                         # Cache pip deps between runs

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest pytest-cov      # Test tools

      - name: Run tests with coverage
        run: |
          pytest app/tests/ -v --tb=short \
            --cov=app/src \
            --cov-report=term-missing \
            --cov-fail-under=70             # Fail build if coverage < 70%

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage

  # ── Job 2: Build & Push ───────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test                             # Only runs if tests pass
    if: github.event_name == 'push'         # Don't push on PRs

    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Generate image tags ─────────────────────────────────
      - name: Generate image metadata
        id: meta
        run: |
          # Short SHA for traceability (first 7 chars of commit hash)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # Branch name, sanitized (slashes → dashes)
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          # Build date in ISO format
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Tag strategy:
          #   main branch  → latest + sha tag
          #   other branch → branch-sha tag
          if [ "${{ github.ref_name }}" = "main" ]; then
            IMAGE_TAG="latest"
            VERSIONED_TAG="${SHORT_SHA}"
          else
            IMAGE_TAG="${BRANCH}-${SHORT_SHA}"
            VERSIONED_TAG="${BRANCH}-${SHORT_SHA}"
          fi

          echo "image-tag=${IMAGE_TAG}"       >> $GITHUB_OUTPUT
          echo "versioned-tag=${VERSIONED_TAG}" >> $GITHUB_OUTPUT
          echo "short-sha=${SHORT_SHA}"        >> $GITHUB_OUTPUT
          echo "build-date=${BUILD_DATE}"      >> $GITHUB_OUTPUT

          echo "=== Image Tags ==="
          echo "Primary:   ${IMAGE_TAG}"
          echo "Versioned: ${VERSIONED_TAG}"
          echo "SHA:       ${SHORT_SHA}"

      # ── AWS ECR Login ───────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build Docker image ──────────────────────────────────
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ steps.meta.outputs.image-tag }}
          SHORT_SHA:    ${{ steps.meta.outputs.short-sha }}
          BUILD_DATE:   ${{ steps.meta.outputs.build-date }}
        run: |
          # Build with metadata baked in as build args
          docker build \
            --file docker/Dockerfile \
            --build-arg APP_VERSION="${{ github.ref_name }}-${SHORT_SHA}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --build-arg GIT_COMMIT="${{ github.sha }}" \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ steps.meta.outputs.versioned-tag }}" \
            .

          echo "Built: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      # ── Security scan (lightweight) ─────────────────────────
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:    "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image-tag }}"
          format:       table
          exit-code:    0          # Set to 1 to FAIL build on HIGH/CRITICAL vulns
          severity:     HIGH,CRITICAL

      # ── Push to ECR ─────────────────────────────────────────
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ steps.meta.outputs.image-tag }}
        run: |
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ steps.meta.outputs.versioned-tag }}"
          echo "✅ Pushed: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      # ── Save image info for CD job ──────────────────────────
      - name: Save image URI to artifact
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ steps.meta.outputs.image-tag }}
        run: |
          echo "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" > image-uri.txt
          cat image-uri.txt

      - name: Upload image URI artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-uri
          path: image-uri.txt
